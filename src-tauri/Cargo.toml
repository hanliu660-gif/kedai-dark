[package]
name = "kedai-desktop"
version = "0.4.2"
description = "Kedai 桌面应用(Tauri 壳 + 内嵌 Rust 服务)"
edition = "2021"
license = "MIT"

[lib]
name = "kedai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 两个可执行入口均为桌面专属(main.rs/portable_main.rs 带 windows_subsystem 属性)。
# 注意:不加 required-features/feature 门控——桌面构建脚本(build.ps1)与 AGENTS.md
# 的验证命令都以默认 feature 调 cargo,任何默认值改动都会破坏桌面流程。
# Android 侧多编两个 bin 无副作用(不参与 APK 打包,Tauri 只取 libkedai_desktop_lib.so)。
[[bin]]
name = "kedai-desktop"
path = "src/main.rs"

# 便携构建使用独立产物名,避免已运行的开发版锁住 kedai-desktop.exe。
[[bin]]
name = "kedai-portable"
path = "src/portable_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["time", "rt", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest 仅用于启动期健康检查(health_ok);TLS 后端按目标平台分离,见文件末尾。
url = "2"
# 必须与 kedai-server 的 rusqlite 同代:bundled 会链接 libsqlite3-sys,版本不一致会触发 links="sqlite3" 冲突
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
# 复用既有 axum 后端:以库形式内嵌,同一进程内启动服务
kedai-server = { path = "../server-rs" }
# D-4:日志宏(kedai-server 已迁 tracing;Tauri 2 自身也传递依赖,无新增体量)
tracing = "0.1"

# reqwest 按目标平台选 TLS 后端(与 server-rs 同策略,理由见 server-rs/Cargo.toml)
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }


# [KB-PERF] 2026-10-31:debug 只保留行号表,砍掉局部变量/类型全量符号。
# 实测 debug/deps 里 92 个 .pdb 占 19 GB(默认 debug=2)。
# 保留:panic 栈的文件名:行号(仍可定位);
# 失去:调试器里看局部变量。若需完整调试,临时改回 debug = 2。
[profile.dev]
debug = "line-tables-only"

# [KB-PERF] 依赖 crate 不产生调试符号(它们本来也不需要单步调试)。
[profile.dev.package."*"]
debug = false
[profile.release]
# 2026-10-26:与 server-rs 同步改成 thin LTO(理由见 server-rs/Cargo.toml 同段注释)。
lto = "thin"
strip = true

# MSVC 本地化链接进度消息的告警抑制(2026-09-16,详见 MAINTENANCE.md §10 条目 33):
# 本包 crate-type 含 cdylib(Android 必需,见上方 [lib] 注释),在 Windows/MSVC 下链接 cdylib 时
# link.exe 会向 stdout 打印进度消息「正在创建库 …dll.lib 和对象 …dll.exp」。Rust 1.97 起
# linker_messages lint 默认 warn 并转发白名单外的链接器输出;而 rustc 的白名单只匹配英文字面串
# ("Creating library" 等),中文匹配不上,故被报为告警。
# 触发条件:该告警只在 link.exe 输出**合法 UTF-8** 时出现(需 UTF-8 代码页 / chcp 65001);
# 默认 GBK 代码页下 rustc 因 UTF-8 解码失败而静默,故不一定每次构建都可见。
# 代价(本机实测确认,勿误以为「只静默进度消息」):linker_messages 是链接器输出的**唯一**通道,
# 白名单外的 stdout/stderr 会合并进同一条诊断(实测 LNK4044 与「正在创建库」出现在同一段)。
# 故 allow 之后链接器**警告**也不再上报,等价于回到 Rust 1.97 之前的行为;链接**错误**
# (导致构建失败者,走 error: linking with ... failed 路径)不受影响,仍会正常报出。
# 参考 rust-lang/rust#159133 与 #136096;Rust >= 1.99(PR #160445 改为按 LNK 码分类)后本行可移除。

# [KB-PERF] 2026-10-31:开启 release 增量编译。
# release 默认 incremental=false ⇒ 每次改动都要对全部 CGU 重跑 opt-level=3 代码生成。
# 代价:多占约 3~5 GB;收益:改少量代码或只改前端嵌资源时可复用未变模块。
# ⚠️ 前提:必须同时删掉 build.ps1 / build-portable.ps1 里的 cargo clean -p kedai-server,
#    否则每次构建都会把本目录增量缓存连根删光(incremental 白配)。
incremental = true
[lints.rust]
linker_messages = "allow"

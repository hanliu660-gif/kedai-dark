<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover:配合 env(safe-area-inset-*) 处理刘海屏/手势条(移动端布局见 style.css 末尾) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 禁止缓存:WebView2/浏览器会缓存旧 index.html,导致加载旧 hash 资源,表现为「重启后还是旧界面」 -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- 夜间模式首帧引导(NIGHT-1):放在样式与模块脚本之前同步执行,挂上 <html data-theme>,
         消掉「深色偏好用户在 JS 包下载完之前先看到一帧亮色」。与 src/theme.ts 的存储键/默认值同源。 -->
    <script src="/theme-boot.js"></script>
    <title>Kedai</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
